services:
  db:
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: always
    # 资源限制与文件句柄上限：防止高并发采集时耗尽句柄，同时限制单容器内存占用避免宿主机内存溢出。
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 384m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: nodeops
      POSTGRES_USER: nodeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次初始化（数据卷为空）时自动执行；已有数据的库升级由 migrate 服务负责。
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeops -d nodeops"]
      interval: 60s
      timeout: 3s
      retries: 10

  # 升级时补跑新增迁移的幂等执行器；已应用的迁移会被自动跳过。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build
    command: ["go", "run", "./server/cmd/migrate"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # 挂载宿主机迁移目录，确保始终读取最新迁移脚本而不受镜像层缓存影响。
    volumes:
      - ./server/migrations:/src/server/migrations:ro
    environment:
      DATABASE_URL: postgres://nodeops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nodeops?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: teyir-console-api:local
    # 预留优雅停机窗口，确保 HTTP 排空与执行器状态回写完成。
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 192m
    memswap_limit: 256m
    environment:
      PORT: 8080
      DATABASE_URL: postgres://nodeops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nodeops?sslmode=disable
      # 支持逗号分隔的多个跨域来源。
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      # 允许携带 X-Forwarded-For 的可信反代网段；留空时仅信任直连对端地址（默认安全关闭）。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PORTAL_TLS_PINS: ${PORTAL_TLS_PINS:-}
      # 控制台外部访问地址（用于 Telegram 告警与菜单跳转按钮，可选）。
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      # 发给买家的订阅与交付链接域名（留空则按请求 Host 自动推导）。
      SUBSCRIPTION_PUBLIC_BASE_URL: ${SUBSCRIPTION_PUBLIC_BASE_URL:-}
      # 备用订阅域名（逗号分隔，可选）。
      SUBSCRIPTION_BACKUP_BASE_URLS: ${SUBSCRIPTION_BACKUP_BASE_URLS:-}
      # 默认订阅分组名称（可在控制台系统设置中随时覆盖）。
      SUBSCRIPTION_DEFAULT_NAME: ${SUBSCRIPTION_DEFAULT_NAME:-Teyir}
      # 外部商城续费基础地址（可选，例如 https://shop.example.com/）。
      STORE_RENEW_BASE_URL: ${STORE_RENEW_BASE_URL:-}
      # 面板登录人机验证（Cloudflare Turnstile，两项同时配置才启用）。
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # 可选：内部服务登录豁免密钥。
      LOGIN_SERVICE_KEY: ${LOGIN_SERVICE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?Set CREDENTIAL_KEY in .env}
      # 可选：宿主机封禁联动服务地址与认证令牌。
      BAN_WEBHOOK_URL: ${BAN_WEBHOOK_URL:-}
      BAN_WEBHOOK_TOKEN: ${BAN_WEBHOOK_TOKEN:-}
      # 可选：一键安装节点脚本地址（HTTPS）及节点门户更新源仓库（格式 owner/repo）。
      HY2_INSTALL_SCRIPT_URL: ${HY2_INSTALL_SCRIPT_URL:-}
      HY2_INSTALLER_REPO: ${HY2_INSTALLER_REPO:-}
      EXECUTOR_INTERVAL_SECONDS: ${EXECUTOR_INTERVAL_SECONDS:-20}
      ENABLE_COLLECTOR: ${ENABLE_COLLECTOR:-false}
      # 离线地区归属库路径（文件不存在时自动跳过并记录告警，不影响启动）。
      GEO_OFFLINE_DB: ${GEO_OFFLINE_DB:-/data/geo-offline.json}
      GEO_ENABLE_API: ${GEO_ENABLE_API:-true}
      GEO_API_BASE_URL: ${GEO_API_BASE_URL:-}
      IP_PURITY_OFFLINE_DB: ${IP_PURITY_OFFLINE_DB:-}
      IP_PURITY_API_KEY: ${IP_PURITY_API_KEY:-}
      IP_PURITY_API_BASE_URL: ${IP_PURITY_API_BASE_URL:-}
      VIEWER_RESTRICT_SUBSCRIPTIONS: ${VIEWER_RESTRICT_SUBSCRIPTIONS:-false}
    # 挂载离线归属库目录，方便宿主机放入数据文件而无需重建镜像。
    volumes:
      - ./geo-data:/data:ro
    # 默认仅监听本机回环，由 web 容器统一对外代理。
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      # 别名 panel-api 仅挂载在内部网络，供 web 容器反代使用。
      default:
        aliases: [panel-api]
      ingress: {}

  web:
    init: true
    image: teyir-console-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 256m
    memswap_limit: 384m
    environment:
      # 不赋默认值：仅当宿主机显式设置 SITE_ADDRESS 时注入，未设置时 Caddy 自动回退监听 :80。
      - SITE_ADDRESS
    ports:
      # 默认绑定 127.0.0.1，如需直接对外服务请在 .env 显式设置 WEB_BIND=0.0.0.0。
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
      - "${WEB_BIND:-127.0.0.1}:${WEB_TLS_PORT:-443}:443"
    volumes:
      # 持久化 Caddy 证书与运行配置，避免容器重建反复申请证书触发签发限流。
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      default: {}
      ingress: {}

networks:
  default:
  # 可选的外部接入网络名称：通过 .env 设置 WEB_INGRESS_NETWORK 可接入已有外层反代网络。
  ingress:
    name: ${WEB_INGRESS_NETWORK:-teyir-console-internal}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
