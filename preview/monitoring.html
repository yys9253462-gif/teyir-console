<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101411" />
    <!-- 不加载外部字体；fetch 由入口完全接管，CSP 另阻止跨站连接和表单提交。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; form-action 'none'; object-src 'none'; base-uri 'self'" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101411'/%3E%3Ctext x='32' y='44' fill='%23c4f15b' text-anchor='middle' font-family='sans-serif' font-size='38' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E" />
    <title>Teyir 节点监控 · 本地设计预览</title>
    <style>
      /* 只布置预览工具条；首页与侧栏样式仍由真实 App 提供。 */
      #preview-controls { position: sticky; top: 0; z-index: 35; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 18px; border-bottom: 1px solid var(--line, #344132); background: var(--panel, #151a16); color: var(--text, #e7ece6); font: 13px/1.5 system-ui, sans-serif; }
      #preview-controls strong { color: var(--accent, #c4f15b); }
      #preview-controls nav { display: flex; flex-wrap: wrap; gap: 6px; }
      #preview-controls a, #preview-controls button { border: 1px solid var(--line, #344132); border-radius: 5px; padding: 4px 9px; background: transparent; color: inherit; text-decoration: none; font: inherit; cursor: pointer; }
      #preview-controls a[aria-current="page"] { background: var(--accent, #c4f15b); color: var(--bg, #101411); }
      #preview-controls small { color: var(--muted, #99a895); }
      body[data-design-preview] .environment-pill, body[data-design-preview] .connection-line[title], body[data-design-preview] .page-footer > span:nth-child(2) { display: none; }
      body[data-design-preview] .topbar { top: var(--preview-bar-height, 64px); }
      #preview-write-status { flex-basis: 100%; color: var(--accent, #c4f15b); }
      #preview-write-status:empty { display: none; }
      #preview-fatal { padding: 24px; white-space: pre-wrap; }
      body[data-design-preview] .sidebar { top: var(--preview-bar-height, 64px); }
      body[data-design-preview] .app-shell, body[data-design-preview] .main-area { min-height: calc(100vh - var(--preview-bar-height, 64px)); }
    </style>
  </head>
  <body>
    <header id="preview-controls" aria-label="本地设计预览控制栏">
      <strong>本地设计预览 · 示例数据</strong>
      <nav id="preview-scenarios" aria-label="预览场景"></nav>
      <small>所有接口均由本地 mock 响应 · 操作只在本页模拟</small>
      <button id="preview-login" type="button">查看登录页</button>
      <output id="preview-write-status" aria-live="polite"></output>
    </header>
    <div id="root"></div>
    <noscript>本地预览需要启用 JavaScript。页面仅展示示例数据。</noscript>
    <script type="module" src="/preview/monitoring.tsx"></script>
  </body>
</html>
