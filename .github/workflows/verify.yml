name: Verify Teyir Console
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: nodeops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODEOPS_TEST_DATABASE_URL: postgres://postgres:ci-fixture-only@localhost:5432/nodeops_test?sslmode=disable
      HY2_REPAIR_TEST_DATABASE_URL: postgres://postgres:ci-fixture-only@localhost:5432/nodeops_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: 校验 Telegram 表单生成一致性
        run: go run ./tools/telegram-forms -check
      - name: 运行 Go 单元测试、PostgreSQL 集成测试与竞态检测
        run: go test -race ./server/... -count=1 -coverprofile=coverage.out
      - name: 运行 Go 静态检查与主程序编译验证
        run: |
          go vet ./server/...
          go build -o /tmp/teyir-api ./server/cmd/api
          go build -o /tmp/teyir-migrate ./server/cmd/migrate
      - name: 运行 Go 依赖安全漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./server/...
      - name: 安装前端依赖、执行高危漏洞审计与构建
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npm run build
      - name: 校验前端接口契约
        run: node tests/ops-contract.cjs
      - name: 校验安装与部署脚本语法及单元测试
        run: |
          bash -n install.sh deploy.sh deploy/update.sh
          python3 -m unittest tests/deploy-update-ref-test.py tests/install-script-test.py
      - name: 校验容器编排配置语法
        env:
          POSTGRES_PASSWORD: ci-fixture-only-password
          JWT_SECRET: ci-fixture-only-jwt-secret-at-least-32-chars
          SEED_ADMIN_EMAIL: admin@example.invalid
          SEED_ADMIN_PASSWORD: ci-fixture-only-admin-pass
          CREDENTIAL_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config -q
      - name: 校验反代配置（默认 HTTP 与域名自动 HTTPS 双形态）
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e SITE_ADDRESS=panel.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-artifacts
          path: |
            coverage.out
            dist/
